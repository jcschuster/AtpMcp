name: skill

# Attaches atp-mcp-skill-<tag>.zip to a release: the contents of
# skills/atp-mcp/ with SKILL.md at the archive root, as Agensi's upload expects.
# Called by release.yml, or runs when a release is published by hand.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Build the archive
        working-directory: skills/atp-mcp
        run: zip -r "$GITHUB_WORKSPACE/atp-mcp-skill-$TAG.zip" .
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "atp-mcp-skill-$TAG.zip" --clobber
